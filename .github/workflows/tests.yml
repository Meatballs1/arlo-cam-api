name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      # The RTCP module and the RTSP parsing helpers are dependency-free, so the
      # unit tests run without installing libvlc or the server requirements.
      - run: python -m pytest tests/ -v
